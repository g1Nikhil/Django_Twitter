<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: #111827;
            color: #ffffff;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #f8f9fa;
        }

        p, small {
            color: #cbd5e1;
        }

        a {
            color: #86b7fe;
        }

        input, textarea, select {
            color: #f8f9fa;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 6px;
        }

        button {
            font: inherit;
        }

        .site-container {
            width: min(100% - 32px, 1140px);
            margin: 0 auto;
            padding: 24px 0;
        }

        .site-navbar {
            min-height: 70px;
            padding: 0 16px;
            background: #212529;
            border-bottom: 1px solid #343a40;
        }

        .site-nav-inner,
        .site-nav-collapse,
        .site-nav-list,
        .site-search {
            display: flex;
            align-items: center;
        }

        .site-nav-inner {
            min-height: 69px;
        }

        .site-brand {
            margin-right: 28px;
            color: #f8f9fa;
            font-size: 24px;
            text-decoration: none;
            white-space: nowrap;
        }

        .site-nav-collapse {
            flex: 1;
            justify-content: space-between;
        }

        .site-nav-list {
            gap: 20px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .site-navbar .site-nav-link {
            display: block;
            padding: 8px 0;
            color: #adb5bd;
            font-size: 18px;
            text-decoration: none;
        }

        .site-navbar .site-nav-link.active,
        .site-navbar .site-nav-link:hover {
            color: #f8f9fa;
        }

        .site-navbar .site-nav-link.disabled {
            color: #6c757d;
            cursor: default;
        }

        .site-navbar .site-dropdown-toggle::after {
            display: inline-block;
            margin-left: 7px;
            vertical-align: 3px;
            content: "";
            border: 5px solid transparent;
            border-top-color: currentColor;
            border-bottom: 0;
        }

        .site-dropdown {
            position: relative;
        }

        .site-dropdown-menu {
            position: absolute;
            z-index: 10;
            top: 100%;
            left: -12px;
            display: none;
            min-width: 180px;
            margin: 0;
            padding: 8px 0;
            list-style: none;
            background: #2b3035;
            border: 1px solid #495057;
            border-radius: 6px;
            box-shadow: 0 8px 18px #0005;
        }

        .site-dropdown:hover .site-dropdown-menu,
        .site-dropdown:focus-within .site-dropdown-menu,
        .site-dropdown.is-open .site-dropdown-menu {
            display: block;
        }

        .site-dropdown-menu a {
            display: block;
            padding: 7px 16px;
            color: #f8f9fa;
            text-decoration: none;
        }

        .site-dropdown-menu a:hover {
            background: #343a40;
        }

        .site-dropdown-menu hr {
            margin: 8px 0;
            border: 0;
            border-top: 1px solid #495057;
        }

        .site-search {
            gap: 10px;
        }

        .site-search input {
            width: 245px;
            padding: 9px 14px;
            color: #f8f9fa;
            background: #212529;
            border: 1px solid #495057;
            border-radius: 7px;
            font: inherit;
        }

        .site-search button {
            padding: 9px 15px;
            color: #198754;
            background: transparent;
            border: 1px solid #198754;
            border-radius: 7px;
            font: inherit;
            cursor: pointer;
        }

        .site-search button:hover {
            color: #fff;
            background: #198754;
        }

        .site-navbar-toggle {
            display: none;
            padding: 6px 10px;
            color: #adb5bd;
            background: transparent;
            border: 1px solid #6c757d;
            border-radius: 5px;
            font-size: 22px;
        }

        .tweet-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 0 0 22px;
        }

        .tweet-page-header h1 {
            margin: 0;
            font-size: clamp(1.6rem, 4vw, 2rem);
        }

        .tweet-create-link,
        .tweet-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 13px;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #bfdbfe;
            background: #172554;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 150ms ease, border-color 150ms ease;
        }

        .tweet-create-link:hover,
        .tweet-action:hover {
            color: #fff;
            background: #1d4ed8;
            border-color: #60a5fa;
        }

        .tweet-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: start;
            gap: 16px;
        }

        .tweet-card {
            overflow: hidden;
            padding: 16px;
            background: linear-gradient(145deg, #1b2638, #172033);
            border: 1px solid #2d3a50;
            border-radius: 16px;
            box-shadow: 0 12px 28px #050b1633;
        }

        .tweet-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .tweet-avatar {
            display: grid;
            flex: 0 0 36px;
            width: 36px;
            height: 36px;
            place-items: center;
            border: 1px solid #5274b8;
            border-radius: 50%;
            color: #dbeafe;
            background: linear-gradient(145deg, #315ca8, #243a67);
            font-weight: 700;
            text-transform: uppercase;
        }

        .tweet-author {
            margin: 0;
            color: #f8fafc;
            font-size: 0.98rem;
            font-weight: 700;
        }

        .tweet-date {
            margin: 3px 0 0;
            color: #94a3b8;
            font-size: 0.82rem;
        }

        .tweet-text {
            margin: 0;
            color: #e2e8f0;
            font-size: 0.96rem;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }

        .tweet-photo {
            display: block;
            width: 100%;
            max-height: 230px;
            margin-top: 16px;
            object-fit: contain;
            background: #0b1220;
            border: 1px solid #344258;
            border-radius: 12px;
        }

        .tweet-card-actions {
            display: flex;
            gap: 9px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #2d3a50;
        }

        .tweet-action-delete {
            color: #fecaca;
            background: #3b171e;
            border-color: #7f2937;
        }

        .tweet-action-delete:hover {
            background: #991b1b;
            border-color: #ef4444;
        }

        .tweet-empty {
            grid-column: 1 / -1;
            margin: 0;
            padding: 28px;
            color: #cbd5e1;
            background: #1b2638;
            border: 1px dashed #42516a;
            border-radius: 14px;
            text-align: center;
        }

        @media (max-width: 991px) {
            .site-nav-inner {
                flex-wrap: wrap;
                justify-content: space-between;
            }

            .site-navbar-toggle {
                display: block;
            }

            .site-nav-collapse {
                display: none;
                flex: 0 0 100%;
                align-items: flex-start;
                padding: 8px 0 16px;
            }

            .site-nav-collapse.is-open {
                display: block;
            }

            .site-nav-list {
                display: block;
            }

            .site-dropdown-menu {
                position: static;
                margin: 0 0 8px 12px;
            }

            .site-search {
                margin-top: 10px;
            }

            .site-search input {
                width: min(245px, 65vw);
            }
        }

        @media (max-width: 1199px) {
            .tweet-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .tweet-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .tweet-list {
                grid-template-columns: 1fr;
            }

            .tweet-card {
                padding: 16px;
                border-radius: 13px;
            }

            .tweet-page-header {
                align-items: flex-start;
            }

            .tweet-create-link {
                padding: 7px 10px;
                font-size: 0.82rem;
            }
        }
    </style>
    <title>
        {% block title %}
        Chai aur Django
        {% endblock %}
    </title>
</head>
<body>
    <nav class="site-navbar">
        <div class="site-nav-inner">
            <a class="site-brand" href="{% url 'index' %}">Tweetbar</a>
            <button class="site-navbar-toggle" type="button" aria-controls="mainNavbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                ☰
            </button>

            <div class="site-nav-collapse" id="mainNavbar">
                <ul class="site-nav-list">
                    <li>
                        <a class="site-nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
                    </li>
                    <li>
                        <a class="site-nav-link" href="#">Link</a>
                    </li>
                    <li class="site-dropdown">
                        <a class="site-nav-link site-dropdown-toggle" href="#" role="button"
                           aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="site-dropdown-menu">
                            <li><a href="#">Action</a></li>
                            <li><a href="#">Another action</a></li>
                            <li><hr></li>
                            <li><a href="#">Something else</a></li>
                        </ul>
                    </li>
                    <li>
                        <span class="site-nav-link disabled" aria-disabled="true">Disabled</span>
                    </li>
                </ul>
                <form class="site-search" role="search" method="get">
                    <input type="search" placeholder="Search"
                           aria-label="Search" name="q">
                    <button type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="site-container">
        {% block content %}
        
        {% endblock %}
    </main>
    <script>
        const navbarToggle = document.querySelector('.site-navbar-toggle');
        const navbarMenu = document.querySelector('#mainNavbar');
        const dropdownToggle = document.querySelector('.site-dropdown-toggle');
        const dropdown = document.querySelector('.site-dropdown');

        navbarToggle.addEventListener('click', () => {
            const isOpen = navbarMenu.classList.toggle('is-open');
            navbarToggle.setAttribute('aria-expanded', isOpen);
        });

        dropdownToggle.addEventListener('click', (event) => {
            event.preventDefault();
            const isOpen = dropdown.classList.toggle('is-open');
            dropdownToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>
</body>
</html>
