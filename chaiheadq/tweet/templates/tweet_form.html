{% extends "layout.html" %}

{% block title %}{{ action }} tweet{% endblock %}

{% block content %}
<section class="editor-page">
    <header class="editor-heading">
        <p class="feed-eyebrow">Make it yours</p>
        <h1>{{ action }} a post</h1>
    </header>
    <form class="editor-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button-primary" type="submit">{{ action }} post</button>
            <a class="button-secondary" href="{% url 'tweet_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
