{% extends "layout.html" %}

{% block title %}Delete tweet{% endblock %}

{% block content %}
<section class="confirm-page">
    <p class="feed-eyebrow">One last check</p>
    <h1>Delete this post?</h1>
    <blockquote>{{ tweet.text }}</blockquote>
    <form method="post">
        {% csrf_token %}
        <button class="button-danger" type="submit">Delete post</button>
        <a class="button-secondary" href="{% url 'tweet_list' %}">Keep post</a>
    </form>
</section>
{% endblock %}
